# Scheduled deep fuzz. The per-push jobs run the fuzz layers at per-PR depth (40
# Hypothesis examples per property, 250 sweep mutants with a fixed seed); this workflow
# runs the SAME code paths -- scripts/ci_checks.py, one implementation -- at scheduled
# depth (1000 examples, 2000 mutants, a fresh seed every run), so the exploration
# surface grows with wall-clock time instead of being capped by the push budget.
#
# Manual trigger exists because a deep run is also the first thing to reach for after a
# new statement kind lands in the effect table.
name: fuzz-deep

on:
  workflow_dispatch:
  schedule:
    # Daily at 04:17 UTC. Off the hour: scheduled jobs pile up on the hour.
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  properties-deep:
    # No JVM, no engine: the JVM-free mutation properties at deep depth.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Deep property fuzz
        run: python scripts/ci_checks.py fuzz-fast-deep

  differential-deep:
    # Matrixed over the same three engines as the per-push differential job, for the
    # same reason: one engine leaves two pinned grammars with no live check.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pyspark-version: ["3.5.1", "4.1.3", "4.2.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the matrixed engine
        # Same shape as the differential job in ci.yml: the version comes from the
        # matrix, not from pyproject, so all three engines are reachable from one
        # definition.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "pyspark==${{ matrix.pyspark-version }}"

      - name: Confirm the engine and a working JVM
        # An engine that failed to load makes the fuzz skip-and-pass; this is what
        # proves the matrix entry, not the resolver, chose the engine.
        run: |
          python -c "import pyspark; assert pyspark.__version__ == '${{ matrix.pyspark-version }}', pyspark.__version__; print('pyspark', pyspark.__version__)"
          java -version

      - name: Deep differential fuzz against Spark ${{ matrix.pyspark-version }}
        run: python scripts/ci_checks.py fuzz-deep --engine ${{ matrix.pyspark-version }}