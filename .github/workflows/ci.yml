name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same ref, but never cancel master: master is the
# release line and a half-finished cancel there would leave it unverified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Read-only by default. The publish job opts back in to what it actually needs.
permissions:
  contents: read

jobs:
  fast:
    # The fast suite: ~2,900 tests, no JVM, no pyspark. Deliberately installed from the
    # `dev` extra only -- `dev` must NOT contain pyspark, because the suite stays at ~20s
    # precisely because the everyday environment has no Spark in it (pyproject.toml).
    #
    # Matrix: 3.13 is the version the project is developed against locally, and 3.12 is
    # the oldest interpreter the suite currently passes on. 3.10 is NOT in this matrix
    # and must not be added without fixing it first: the library supports 3.10 (see
    # requires-python), but the suite does not collect there. The guard step below
    # exists to turn that into a clear message rather than a collection error, and it
    # only works because it runs after actions/setup-python.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # No lockfile exists in this repo, so hash pyproject.toml instead: the
          # dependency set is declared there and nowhere else. Without an explicit
          # dependency path, setup-python cannot build a cache key and falls back to
          # hashing every requirements.txt it can find -- of which there are none.
          cache-dependency-path: pyproject.toml

      - name: Reject an unsupported Python
        # MUST run after actions/setup-python above, or `python` here is the
        # ubuntu-latest image default rather than matrix.python-version, and the
        # guard silently inspects the wrong interpreter.
        #
        # requires-python is >=3.10 and the runtime source really is 3.10-clean, so
        # the library supports 3.10. The *test suite* does not collect on it:
        # tests/test_packaging.py imports tomllib (3.11+), and IntFlag.name for a
        # multi-bit flag is None on 3.10, which fails test_effects.py. Rather than
        # let the matrix fail with a confusing collection error, say so here.
        run: |
          python - <<'PY'
          import sys
          if sys.version_info < (3, 11):
              raise SystemExit(
                  f"sparkscreen's test suite requires Python >= 3.11 (running "
                  f"{sys.version_info.major}.{sys.version_info.minor}). The library "
                  "itself supports 3.10 -- see requires-python in pyproject.toml -- "
                  "so this is a suite limitation, not a packaging one."
              )
          PY

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prove the fast environment has no engine
        run: python scripts/ci_checks.py no-pyspark

      - name: Fast test suite
        # The whole tests/ tree, and tests/differential is NOT deselected: it is already
        # inert here because its modules call pytest.importorskip("pyspark") at import
        # and skip cleanly. Deselecting would be a no-op that reads as if it excluded
        # something. scripts/ci_checks.py runs the identical invocation, so a local run is
        # evidence about this job rather than a similar-looking test.
        run: python scripts/ci_checks.py fast

  wheel:
    # The generated ANTLR parsers are committed and ship in the wheel, so the artefact
    # must import and screen on a machine with no JVM and no grammar sources. That is a
    # release property, and CI is the only place it is actually true.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build

      - name: Build the wheel
        run: python -m build --wheel --outdir dist

      - name: Assert no grammar sources or ANTLR jar shipped
        run: python scripts/ci_checks.py wheel-contents

      - name: Install the wheel into a clean environment and screen with no JVM
        run: python scripts/ci_checks.py wheel-install

      - name: Packaging invariants from the test suite
        # tests/test_packaging.py already asserts the version agreement and the wheel
        # contents. Run it rather than duplicating those checks above -- this step is
        # the belt to that braces, and it fails loudly if `build` ever stops being
        # importable, which would otherwise skip these tests silently.
        run: python -m pytest tests/test_packaging.py -v

  differential:
    # Runs the grammar against a real engine. This is the only job that catches a parser
    # that disagrees with the Spark it claims to screen for -- the case-insensitivity bug
    # was invisible to the entire hand-written corpus.
    #
    # Matrixed over every pinned engine, one job per version, NOT one job installing
    # "the newest pyspark". Three grammars ship, so one engine leaves two of them with
    # no live check at all, and a newest-wins job silently narrows the matrix every time
    # Spark releases. The matrix is the list of grammar keys in spec.py; the suite's
    # test_engine_matrix_covers_every_pinned_grammar asserts the two agree, so adding a
    # grammar without adding a version here fails the fast suite instead of rotting.
    #
    # Needs a JVM and a real pyspark, so it is separate from the fast suite by design.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match these to the pyspark releases the grammar pins were generated from.
        # 3.5.1 and 4.2.0 are the pin releases; 4.1.3 is the newest 4.1 patch, so a 4.1
        # user on any patch gets the line checked at its most capable point.
        pyspark-version: ["3.5.1", "4.1.3", "4.2.0"]
    # Generous: Spark session startup dominates, and a local run takes ~70s on a warm
    # machine with a local JVM. Cold CI plus JVM download needs real headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the matrixed engine
        # The version comes from the matrix, not from pyproject. `[diff]` still pins
        # pyspark==3.5.1 because that is the default a developer gets locally; CI
        # overrides it here so all three engines are reachable from one definition.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "pyspark==${{ matrix.pyspark-version }}"

      - name: Confirm the engine and a working JVM
        # If either is wrong the suite below would skip or fail confusingly rather than
        # telling us the environment was wrong. Checking the exact version is the point:
        # it is what proves the matrix entry, not the resolver, chose the engine.
        run: |
          python -c "import pyspark; assert pyspark.__version__ == '${{ matrix.pyspark-version }}', pyspark.__version__; print('pyspark', pyspark.__version__)"
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Differential suite against Spark ${{ matrix.pyspark-version }}
        # Carries the collect-count assertion with it. The differential modules gate on
        # `importorskip("pyspark")`, so an engine that failed to load makes pytest exit 0
        # having executed nothing, and three green jobs would have checked nothing. The
        # exit code cannot distinguish that from success, so the count is checked instead.
        run: python scripts/ci_checks.py differential --engine ${{ matrix.pyspark-version }}

  docs:
    # The four documentation audits. These are standalone scripts, NOT pytest tests, so
    # nothing else in CI runs them. They are cheap and they catch real staleness -- a
    # claim in README.md or docs/user-docs/ that has drifted from the code.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Documentation audits
        # Includes _verify_refs.py, which scans for grammar-key and engine-pin literals
        # naming something we do not ship. That check exists because setup.sh carried a
        # retired key in its verification loop for two releases with nothing executing it.
        #
        # One step, not five: a loop or five steps would read as deliberate isolation, but
        # ci_checks.py runs them all under one name, so splitting them here would only
        # duplicate that. The failing script's own output names itself.
        run: python scripts/ci_checks.py audits

      - name: setup.sh parses and its help text is valid
        # setup.sh is the new-contributor path and nothing ran it, which is how it carried a
        # retired grammar key in its verification loop for two releases. Two things guard it
        # now, and this step is the weaker one:
        #
        #   1. _verify_refs.py, in the step above, catches the staleness statically. That is
        #      the real guard and it needs no environment.
        #   2. This step, which catches the script being *broken* -- a bash syntax error, a
        #      helper called before it is defined, --help printing shell code. Those are
        #      cheap to make and would otherwise sit undetected until a new contributor ran
        #      the one script whose entire job is to work for someone who has never used it.
        #
        # `--help` rather than `--check`: a runner has no .venv-pyspark, and `--check`
        # asserts on venvs it legitimately does not have. Provisioning 500MB to validate a
        # script is the tail wagging the dog, and the differential job already proves the
        # engines work. --help exercises argument parsing and the usage() helper, which is
        # where the real bugs in a shell script of this shape live.
        run: |
          bash -n scripts/setup.sh
          ./scripts/setup.sh --help | tee /tmp/usage.txt
          grep -q -- "--engine" /tmp/usage.txt || {
            echo "::error::setup.sh --help does not mention --engine"
            exit 1
          }
          if grep -qE '^\s*(set |if |for |[A-Z_]+=)' /tmp/usage.txt; then
            echo "::error::setup.sh --help printed shell code; usage() range is wrong"
            exit 1
          }

  grammar-build:
    # Regenerating the parsers is a maintainer operation: the generated parsers are
    # committed deliberately so that installing and running needs no JVM. This job proves
    # the committed parsers still match what the pinned grammars and the port produce,
    # so a stale parser surfaces here instead of at the next release.
    #
    # Note this DOES regenerate and diff. That is the point of the job, and it is safe:
    # verified locally, regeneration reproduces the committed files byte for byte.
    # Nothing on the runtime path regenerates anything, so a failure here is a
    # maintainer signal ("run the build and commit"), not a broken install.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache the ANTLR tool jar
        # The jar is a gitignored build input (see .gitignore: src/sparkscreen/grammar/.cache/).
        # It is downloaded on demand by sparkscreen.grammar.spec._antlr_jar. Caching it
        # keyed on the ANTLR version keeps this job from re-downloading ~2 MB every run.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src/sparkscreen/grammar/.cache
          key: antlr-4.13.1-${{ runner.os }}

      - name: Regenerate parsers from the pinned grammars
        # --generate only; no --fetch. The .g4 sources are vendored in the tree at their
        # pinned 40-character commits, so this must not reach out to fetch grammars.
        run: python -m sparkscreen.grammar.build --generate

      - name: Require a clean diff
        run: |
          if ! git diff --exit-code -- src/sparkscreen/grammar/generated; then
            echo "::error::generated parsers are stale; run 'python -m sparkscreen.grammar.build --generate' and commit the result"
            exit 1
          fi

  build-wheels:
    # Wheel builds across every interpreter the wheel claims to support, plus the
    # release publish. Kept last and independent of every other job: nothing here is
    # consumed by the test jobs, so a packaging-tool failure cannot mask a test result.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the build frontend
        # `build` is a separate distribution from the project and from its own
        # build-system requirements. `python -m build --wheel` fails with
        # "No module named build" without it, and the failure is on every matrix
        # leg -- which would take the publish step below down with it, since that
        # step lives in this job.
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build the wheel
        # Builds from the checkout, so the project's own dependencies are not
        # installed and not needed: `build` provisions the build backend from
        # [build-system].requires in an isolated env.
        run: python -m build --wheel --outdir dist

      # Publishing is release-only and needs an identity token, not an API password.
      # Pinned to a full commit SHA, not the moving release/v1 branch and not the
      # v1.14.2 tag either: a tag can be moved by a maintainer after review, which
      # is the same risk this pin exists to remove. Bump by hand and re-review.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}