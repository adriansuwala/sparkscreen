[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkscreen"
# Single source of truth for the version. src/sparkscreen/__init__.py reads this via
# importlib.metadata rather than hardcoding it, so there is one place to bump.
# tests/test_packaging.py asserts they agree.
version = "0.9.0"
description = "Static safety screening for agent-written PySpark, using real parsers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sparkscreen contributors" }]
keywords = ["pyspark", "security", "static-analysis", "antlr", "sql", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Database",
]

# antlr4-python3-runtime is the only runtime dependency. The Java-based ANTLR *tool*
# is needed only to regenerate parsers, never to install or run.
dependencies = [
  "antlr4-python3-runtime==4.13.1",
]

[project.optional-dependencies]
# Split on purpose. `dev` must NOT contain pyspark: the fast suite is ~2,500 tests in
# 45s and stays that way only because the everyday environment has no PySpark in it.
# `diff` is the separate, slow, JVM-requiring environment for comparing against a real
# engine. See scripts/setup.sh and the two-venv note in AGENTS.md.
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "pytest-cov>=5",
  # tests/test_ci_workflow.py parses .github/workflows/ci.yml, and a YAML guard that
  # silently skips because the parser is absent checks nothing while reporting SUCCESS
  # (F25). PyYAML is test-only and has no runtime path into the package.
  "PyYAML>=6",
]
diff = [
  # Differential testing needs a real engine. Pin the default to the oldest line we
  # support: the recorded expectations in tests/differential/corpus.py are per-engine,
  # so "the newest" would silently compare the wrong grammar to the running engine.
  # CI overrides this per matrix leg (see the `differential` job in ci.yml); locally,
  # install an explicit version to test another line:
  #   pip install "pyspark==4.2.0"
  "pyspark==3.5.1",
]

[project.scripts]
sparkscreen = "sparkscreen.cli:main"

[project.urls]
Homepage = "https://github.com/sparkscreen/sparkscreen"
Source = "https://github.com/sparkscreen/sparkscreen"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sparkscreen*"]

[tool.setuptools.package-data]
# Generated parsers ship in the wheel: installing and running sparkscreen must not
# require a JVM. The globs cover every pinned grammar key, so adding a new one needs no
# edit here.
#
# The vendored `.g4` sources are deliberately EXCLUDED. They are maintainer inputs --
# `sparkscreen-grammar` reads them to re-generate the parsers -- and nothing on the
# runtime path (screen/analysis/model) opens them. They measured 40 KB packed, 8% of the
# wheel, for zero runtime benefit. Shipping them also invites the wrong inference: a user
# who finds a grammar bug would edit a `.g4` in site-packages and see no change, because
# the wheel ships generated parsers and nothing regenerates them.
#
# Consequence: a wheel cannot regenerate its own parsers. Regeneration is a checkout-time
# maintainer operation requiring Java and ANTLR. tests/test_packaging.py enforces both
# the exclusion and the presence of the generated parsers.
"sparkscreen" = [
  "py.typed",
  "grammar/generated/**/*.py",
  "grammar/generated/**/*.tokens",
  "grammar/generated/**/*.interp",
  # The default policy files ship too: `sparkscreen --init-policy --spark <ver>` reads
  # them from the installed package, so a wheel without them breaks the documented
  # starting point for every user who does not copy out of the repo.
  "policies/**/*.jsonc",
]

[tool.mutmut]
# Mutation testing. Config lives here because that is where mutmut 3 reads it from --
# it has no --config flag; `mutmut run` accepts only --max-children.
#
# `process_isolation = "forkserver"` is load-bearing, not a preference. With the default
# "fork", every worker inherits mutmut's main process, which has already imported pytest
# and collected the suite. On this project that deadlocked: seven processes sat at 0% CPU
# in futex_do_wait with no output past "Generating mutants", at ~790 mutants. forkserver
# keeps the main process free of pytest and forks from a dedicated server instead. Mutmut's
# own docs prescribe this switch precisely for a hanging run.
#
# Scoped to the decision logic. The generated ANTLR parsers are hundreds of thousands of
# lines that no test meaningfully asserts against line-by-line.
#
# `source_paths` controls what mutmut COPIES into mutants/ *and* what it may mutate.
# Listing individual modules therefore copies only those modules, and the copied tree then
# fails to import (`No module named 'sparkscreen.grammar'`). So name the package, and
# narrow the target with do_not_mutate.
source_paths = ["src/sparkscreen"]
do_not_mutate = [
  # Generated ANTLR parsers: ~300k lines that no test asserts against line-by-line.
  "src/sparkscreen/grammar/generated/*",
  # Grammar build tooling. Its mutants come back as "no tests", which is noise: this runs
  # at maintainer time to regenerate parsers, and a survivor there says nothing about
  # whether the screener fails open.
  "src/sparkscreen/grammar/port.py",
  "src/sparkscreen/grammar/build.py",
  "src/sparkscreen/grammar/spec.py",
]
process_isolation = "forkserver"
forkserver_warmup = "collect"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Make `src/` importable without PYTHONPATH=src. This is not cosmetic: mutmut spawns
# pytest in child processes that did not inherit the parent shell's PYTHONPATH, so the
# suite failed there with ModuleNotFoundError while passing fine by hand. Anything that
# runs the suite as a subprocess needs this to work.
pythonpath = ["src"]
markers = [
  "slow: long-running tests (needs pyspark and a JVM)",
  "fuzz: property-based tests",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["src/sparkscreen"]
branch = true
omit = ["*/grammar/generated/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]