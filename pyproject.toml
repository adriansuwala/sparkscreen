[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkscreen"
# Single source of truth for the version. src/sparkscreen/__init__.py reads this via
# importlib.metadata rather than hardcoding it, so there is one place to bump.
# tests/test_packaging.py asserts they agree.
version = "0.8.0"
description = "Static safety screening for agent-written PySpark, using real parsers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sparkscreen contributors" }]
keywords = ["pyspark", "security", "static-analysis", "antlr", "sql", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Database",
]

# antlr4-python3-runtime is the only runtime dependency. The Java-based ANTLR *tool*
# is needed only to regenerate parsers, never to install or run.
dependencies = [
  "antlr4-python3-runtime==4.13.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "pytest-cov>=5",
  "mutmut>=3",
  # Differential testing needs a real engine. Install the pyspark version you want to
  # compare against alongside these; see tests/differential/.
  "pyspark>=3.5,<4",
]

[project.scripts]
sparkscreen = "sparkscreen.cli:main"

[project.urls]
Homepage = "https://github.com/sparkscreen/sparkscreen"
Source = "https://github.com/sparkscreen/sparkscreen"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sparkscreen*"]

[tool.setuptools.package-data]
# Generated parsers ship in the wheel: installing and running sparkscreen must not
# require a JVM. The globs cover every pinned grammar key, so adding a new one needs no
# edit here.
#
# The vendored `.g4` sources are deliberately EXCLUDED. They are maintainer inputs --
# `sparkscreen-grammar` reads them to re-generate the parsers -- and nothing on the
# runtime path (screen/analysis/model) opens them. They measured 40 KB packed, 8% of the
# wheel, for zero runtime benefit. Shipping them also invites the wrong inference: a user
# who finds a grammar bug would edit a `.g4` in site-packages and see no change, because
# the wheel ships generated parsers and nothing regenerates them.
#
# Consequence: a wheel cannot regenerate its own parsers. Regeneration is a checkout-time
# maintainer operation requiring Java and ANTLR. tests/test_packaging.py enforces both
# the exclusion and the presence of the generated parsers.
"sparkscreen" = [
  "py.typed",
  "grammar/generated/**/*.py",
  "grammar/generated/**/*.tokens",
  "grammar/generated/**/*.interp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running tests (needs pyspark and a JVM)",
  "fuzz: property-based tests",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["src/sparkscreen"]
branch = true
omit = ["*/grammar/generated/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]