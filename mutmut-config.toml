# sparkscreen mutation testing config (mutmut 3.x)
#
# Why this is here: a screener's worst possible bug is one that silently turns DENY into
# ALLOW, and ordinary coverage cannot see that -- the line still executes, it just
# returns the wrong answer. Mutation testing measures whether the *assertions* would
# catch it, which is the question that matters for a security gate and the check that
# agent-written tests are not vacuous.
#
#     uv pip install --python .venv/bin/python mutmut
#     .venv/bin/mutmut run                 # the four decision modules
#     .venv/bin/mutmut results             # survivors = assertions that do not bite
#     .venv/bin/mutmut show <mutant>       # why a specific one survived
#
# NOTE: mutmut 3.x dropped the pytest_add_cli_args / timeout_multiplier / jobs keys that
# were here for mutmut 2.x. They are removed rather than left to be silently ignored.
#
# Targets are scoped to the decision logic on purpose. The grammar port and the ANTLR
# glue are vendored, generated, or exercised by the differential suite against a real
# Spark; mutating them produces noise, not signal. folding.py and calls.py are the
# interesting extensions once this run is clean -- they decide what SQL text is screened
# at all, so a surviving mutant there is the expensive kind.
[tool.mutmut]
paths_to_mutate = [
    "src/sparkscreen/policy.py",
    "src/sparkscreen/model.py",
    "src/sparkscreen/screen.py",
    "src/sparkscreen/analysis/treewalk.py",
]
tests_dir = "tests/"
